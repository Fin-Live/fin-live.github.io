<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Results</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<!--
  The projected view. Everything on it has to be legible from the back row, so
  type scales with the viewport rather than sitting at a fixed size, and there
  is no chrome competing with the bars.

  It deliberately shows nothing but a response count until you press "Show on
  projector" in the cockpit. A tally the room can watch while the poll is still
  open pulls late answers toward whichever bar is winning.
-->
<body class="display">

<div id="login" class="panel login-card">
  <h2>Projector view</h2>
  <p class="muted">Sign in with your instructor account. Normally you won't see
    this — open this page in the same browser as the console and it inherits
    that session.</p>
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username">
  <label for="password" style="margin-top:.6rem">Password</label>
  <input id="password" type="password" autocomplete="current-password">
  <div class="row" style="margin-top:.7rem">
    <button id="login-btn" type="button">Sign in</button>
  </div>
  <p id="login-status" class="status"></p>
</div>

<main id="stage" class="stage" hidden>
  <p id="eyebrow" class="stage-eyebrow"></p>
  <!-- The pasted question. white-space: pre-wrap keeps the line breaks. -->
  <div id="qtext" class="qtext" hidden></div>

  <!-- Holding (poll open, not yet revealed): tell the room how to answer. The
       count keeps participation visible without showing the split. -->
  <section id="holding" class="holding" hidden>
    <p id="respond-note" class="respond-note"></p>
    <p id="holding-sub" class="stage-sub"></p>
  </section>

  <!-- Results: the response count rides in the eyebrow above. Which one shows
       depends on the question type. -->
  <section id="results" class="results-wrap" hidden>
    <div id="dhist" class="dhist"></div>
    <!-- The SVG is wrapped in a sized div; an <svg> as a direct flex item
         collapses to 0x0 in some browsers. -->
    <div id="cloud-wrap" class="cloud-wrap" hidden>
      <svg id="cloud" class="cloud" viewBox="0 0 1280 620" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div id="cards" class="cards" hidden></div>
    <p id="cards-more" class="stage-sub cards-more" hidden></p>
  </section>

  <p id="idle" class="stage-sub idle-note" hidden>Waiting for the next question</p>
</main>

<button id="fullscreen" class="fs-btn" type="button" title="Fullscreen" hidden>⛶</button>

<script type="module" src="js/display.js"></script>
</body>
</html>
